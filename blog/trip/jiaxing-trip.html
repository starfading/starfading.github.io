        <h1>嘉兴之旅</h1>
        <div class="meta">
          <span>2026-08-02</span>
          <span>· 3 分钟阅读</span>
        </div>
      </div>
    </header>
    <div class="post-content">
      <div class="container">
        <p>马上Lastday了，收拾了下行李，顺便去绍兴寄养了鼠鼠，要好久见不到它了。</p>
        <figure>
          <img src="../../assets/images/trip/jiaxing/jx_1.jpg" alt="后备箱准备搬家的鼠鼠" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;">后备箱准备搬家的鼠鼠</figcaption>
        </figure>
        <figure>
          <img src="../../assets/images/trip/jiaxing/jx_2.jpg" alt="鼠鼠，再见了" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;">鼠鼠，再见了</figcaption>
        </figure>
        <p>去绍兴寄养鼠鼠，路过绍兴科技馆，天气不错。</p>
        <figure>
          <img src="../../assets/images/trip/jiaxing/jx_3.jpg" alt="绍兴科技馆" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;">绍兴科技馆</figcaption>
        </figure>
        <p>紧接着驱车去了嘉兴，赶在日落前看了下海盐大风车。</p>
        <figure>
          <img src="../../assets/images/trip/jiaxing/jx_4.jpg" alt="海盐大风车" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;">海盐大风车</figcaption>
        </figure>
        <p>第二天定了凌晨3点半的闹钟，起床去海边看日出，人不算很多，吹着海风，慢慢地等太阳升起来。</p>
        <figure>
          <img src="../../assets/images/trip/jiaxing/jx_5.jpg" alt="海边日出" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;">海边日出</figcaption>
        </figure>
        <figure>
          <img src="../../assets/images/trip/jiaxing/jx_6.jpg" alt="海边日出" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;">海边日出</figcaption>
        </figure>
        <p>end，回去接着睡觉。</p>
