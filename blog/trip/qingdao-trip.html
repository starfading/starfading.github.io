        <h1>再游青岛</h1>
        <div class="meta">
          <span>2026-08-10</span>
          <span>· 3 分钟阅读</span>
        </div>
      </div>
    </header>
    <div class="post-content">
      <div class="container">
        <p>在济南呆了两天，出发去青岛。</p>
        <p>路过胶州湾大桥。</p>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_1.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <p>先去了海之恋公园，可惜受台风白海豚影响，海水比较浑浊，和五一来的那次简直天壤之别，天又开始下雨了，于是回酒店休息。</p>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_2.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_3.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <p>上次来海之恋公园的美照</p>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_7.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_8.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <p>第二天想去青岛极地海洋世界，看了下攻略，正值暑期，人流量很大，作罢，不如上网双排。</p>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_9.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <p>要离开青岛了，再炫一顿小兄弟推荐的双合园，味道真不错，还好没错过。</p>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_4.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_5.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <figure>
          <img src="../../assets/images/trip/qingdao/qd_6.jpg" style="width:100%; border-radius:8px;">
          <figcaption style="text-align:center; color:#888; font-size:0.9em; margin-top:8px;"></figcaption>
        </figure>
        <p>青岛之旅结束，回济南修正下，明天去淄博吃烧烤。</p>
